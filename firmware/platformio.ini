; ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB OPI PSRAM, native USB (ttyACM0, 303a:xxxx).
; Classic ESP32 (CP210x/CH340 → ttyUSB0): use env:esp32dev instead.
; RGB LED: Arduino core default GPIO48 (matches Espressif RMT example + BlinkRGB).
; v1.1 boards with LED on GPIO38: add -DPIN_NEOPIXEL=38 to build_flags below.
[platformio]
default_envs = esp32-s3-n16r8

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.use_1200bps_touch = yes
board_upload.wait_for_upload_port = yes
build_flags =
  -I include
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DARDUINO_USB_MODE=1
lib_deps =
  256dpi/MQTT @ ^2.5.3
  bblanchon/ArduinoJson @ ^7.0.0

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -I include
lib_deps =
  256dpi/MQTT @ ^2.5.3
  bblanchon/ArduinoJson @ ^7.0.0

[env:native]
platform = native
build_flags =
  -std=gnu++17
  -I src
lib_deps =
  bblanchon/ArduinoJson @ ^7.0.0
  https://github.com/emil-e/rapidcheck.git
test_framework = unity
test_build_src = false
